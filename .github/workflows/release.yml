name: Release Packages & Checksums

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Distributions & Generate SHA256SUMS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools & dependencies
        run: |
          python -m pip install --upgrade pip build cyclonedx-bom
          pip install -e .

      - name: Build Python Distribution Packages (Wheel and sdist)
        run: |
          python -m build

      - name: Generate CycloneDX Software Bill of Materials (SBOM)
        run: |
          cyclonedx-py environment --output-format json --outfile dist/kelan-sbom.cdx.json

      - name: Generate SHA256 Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
