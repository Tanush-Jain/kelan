name: Windows x64 Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'kelan/**'
      - 'packaging/windows/**'
      - 'kelan.spec'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/windows-release.yml'
  pull_request:
    paths:
      - 'packaging/windows/**'
      - 'kelan.spec'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build tools and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pyinstaller cyclonedx-bom

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build kelan.exe with PyInstaller
        run: |
          pyinstaller kelan.spec --clean --noconfirm

      - name: Verify kelan.exe functionality on Windows runner
        run: |
          Write-Host "=== 1. Testing plugin registry ==="
          .\dist\kelan\kelan.exe --plugins

          Write-Host "=== 2. Testing kelan doctor ==="
          # Doctor may exit non-zero if Ollama is not running in CI, so run with warning check
          .\dist\kelan\kelan.exe doctor || Write-Warning "Doctor reported readiness warnings in clean CI runner"

          Write-Host "=== 3. Testing scan of fixture codebase ==="
          New-Item -ItemType Directory -Path .\fixture -Force | Out-Null
          Set-Content -Path .\fixture\requirements.txt -Value "requests==2.31.0`n"
          Set-Content -Path .\fixture\app.py -Value "import os`nprint('fixture app')`n"
          .\dist\kelan\kelan.exe run .\fixture --show

      - name: Sign kelan.exe binary (if certificate provided)
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:CERT_BASE64 -and $env:CERT_PASSWORD) {
              Write-Host "Decoding certificate for binary signing..."
              [System.IO.File]::WriteAllBytes("$env:TEMP\cert.pfx", [System.Convert]::FromBase64String($env:CERT_BASE64))
              & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign `
                  /f "$env:TEMP\cert.pfx" `
                  /p $env:CERT_PASSWORD `
                  /fd SHA256 `
                  /tr http://timestamp.digicert.com `
                  /td SHA256 `
                  .\dist\kelan\kelan.exe
              Remove-Item -Force "$env:TEMP\cert.pfx"
              Write-Host "kelan.exe successfully signed with trusted certificate."
          } else {
              Write-Host "::warning::WINDOWS_CERT_BASE64 secret not found. Binary will be built unsigned. Unsigned binaries trigger Windows SmartScreen warnings on launch."
          }

      - name: Build Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss

      - name: Sign KelanSetup.exe installer (if certificate provided)
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:CERT_BASE64 -and $env:CERT_PASSWORD) {
              Write-Host "Signing Inno Setup installer..."
              [System.IO.File]::WriteAllBytes("$env:TEMP\cert.pfx", [System.Convert]::FromBase64String($env:CERT_BASE64))
              & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign `
                  /f "$env:TEMP\cert.pfx" `
                  /p $env:CERT_PASSWORD `
                  /fd SHA256 `
                  /tr http://timestamp.digicert.com `
                  /td SHA256 `
                  .\dist\KelanSetup.exe
              Remove-Item -Force "$env:TEMP\cert.pfx"
              Write-Host "KelanSetup.exe successfully signed."
          }

      - name: Generate CycloneDX Software Bill of Materials (SBOM)
        run: |
          cyclonedx-py environment --output-format json --outfile dist\kelan-sbom.cdx.json

      - name: Package portable ZIP bundle
        run: |
          Compress-Archive -Path dist\kelan\* -DestinationPath dist\kelan-windows-x86_64.zip

      - name: Generate SHA-256 Checksum Manifest
        working-directory: dist
        run: |
          $Assets = @("KelanSetup.exe", "kelan-windows-x86_64.zip", "kelan-sbom.cdx.json")
          $ChecksumLines = foreach ($Asset in $Assets) {
              if (Test-Path $Asset) {
                  $Hash = (Get-FileHash -Path $Asset -Algorithm SHA256).Hash.ToLower()
                  "$Hash  $Asset"
              }
          }
          $ChecksumLines | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kelan-windows-x64-dist
          path: |
            dist/KelanSetup.exe
            dist/kelan-windows-x86_64.zip
            dist/kelan-sbom.cdx.json
            dist/SHA256SUMS.txt
          retention-days: 14

