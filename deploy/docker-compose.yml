version: "3.9"

# ══ Kelan Security — Single Docker Compose ═══════════════════
# Usage:
#   docker compose up -d           (server only)
#   docker compose --profile mon up -d  (+ Prometheus + Grafana)
#   docker compose down

services:

  kelan:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    container_name: kelan
    restart: unless-stopped
    ports:
      - "${KELAN_PORT:-7681}:7681"
    environment:
      - KELAN_DATA_DIR=/app/data
      - KELAN_LOG_DIR=/app/log
      - OLLAMA_ENDPOINT=${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
    volumes:
      - kelan_data:/app/data
      - kelan_logs:/app/log
    networks:
      - kelan_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7681/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  prometheus:
    image: prom/prometheus:latest
    container_name: kelan-prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./deploy/monitoring-prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - kelan_net
    profiles: [mon]

  grafana:
    image: grafana/grafana:latest
    container_name: kelan-grafana
    restart: unless-stopped
    ports: ["3001:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - kelan_net
    depends_on: [prometheus]
    profiles: [mon]

networks:
  kelan_net:
    driver: bridge

volumes:
  kelan_data:
  kelan_logs:
  prometheus_data:
  grafana_data:
