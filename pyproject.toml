[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kelan"
version = "0.1.0"
description = "Kelan Community — AI-native vulnerability scanner, local-first SAST/DAST/SCA engine"
readme = "README.md"
authors = [{ name = "Tanush Jain", email = "kelansecurity@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["security", "sast", "dast", "vulnerability-scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "python-multipart>=0.0.20",
    "starlette>=0.38.0",
    "httpx>=0.28.0",
    "aiohttp>=3.11.0",
    "aiofiles>=24.1.0",
    "tenacity>=9.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "cryptography>=44.0.0",
    "PyJWT[crypto]>=2.9.0",
    "pynacl>=1.6.0",
    "psutil>=6.1.0",
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=8.0.0",
    "structlog>=24.4.0",
    "python-json-logger>=3.2.0",
    "click>=8.1.0",
    "rich>=13.9.0",
    "typer>=0.13.0",
    "python-dotenv>=1.2.0",
    "tree-sitter>=0.21.3",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.2",
    "tree-sitter-typescript>=0.21.2",
    "tree-sitter-go>=0.21.0",
    "feedparser>=6.0.0",
]

[project.optional-dependencies]
recon = [
    "scapy>=2.7.0",
    "netifaces>=0.11.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.1",
    "kyber-py>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/Tanush-Jain/kelan"
Repository = "https://github.com/Tanush-Jain/kelan"
Issues = "https://github.com/Tanush-Jain/kelan/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["kelan", "kelan.*"]
exclude = ["kelan-pro*", "kelan_pro*", "tests*", "archive*"]

[project.scripts]
# Installs 'kelan' as a shell command that dispatches subcommands.
# Run:  pip install -e .  to activate.
kelan = "kelan.scanner.entrypoint:main"


[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["kelan"]
omit = [
  "kelan/tests/*",
  "kelan/server.py",
  "kelan/enforcement/ebpf_bridge.py",   # eBPF is hardware-specific
  "kelan/api/websocket/*",
  "**/__init__.py",
  "kelan/dast/cli.py",
  "kelan/scanner/cli.py",
  "kelan/scanner/agent.py",
  "kelan/scanner/analyzer.py",
  "kelan/scanner/chunker.py",
  "kelan/scanner/entrypoint.py",
  "kelan/scanner/prompts.py",
  "kelan/plugins/sast_adapter.py",
  "kelan/plugins/dast_adapter.py",
  "kelan/plugins/analyze_ratelimit.py",
  "kelan/plugins/chains.py",
  "kelan/plugins/cloud.py",
  "kelan/plugins/runtime.py",
  "kelan/doctor.py",
  "kelan/run.py",
]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = true

[tool.ruff]
exclude = [
  "eval/corpus",
  "scripts",
  "tools",
  "scratch",
  "build",
  "dist",
  ".venv",
  "venv"
]

[tool.ruff.lint]
ignore = [
  "E402", "E701", "E702", "E722", "F841",
  "BLE001", "S110", "S112",
  "RUF059", "RUF012", "RUF015",
  "B008", "B017",
  "ASYNC230", "ASYNC220",
  "TRY004", "TRY002",
  "SIM102", "SIM103",
  "UP007", "UP011", "UP035", "UP041", "UP045",
  "I001",
  "C401",
  "DTZ005", "ISC004",
  "PIE810", "PLW1510", "PLW0602",
  "FURB167",
]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["call-arg", "var-annotated"]
