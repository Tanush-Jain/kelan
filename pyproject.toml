[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kelan"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["kelan*"]

[project.scripts]
# Installs 'kelan' as a shell command that dispatches subcommands.
# Run:  pip install -e .  to activate.
kelan = "kelan.scanner.entrypoint:main"


[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["kelan"]
omit = [
  "kelan/tests/*",
  "kelan/server.py",
  "kelan/enforcement/ebpf_bridge.py",   # eBPF is hardware-specific
  "kelan/api/websocket/*",
  "**/__init__.py"
]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.ruff]
exclude = [
  "scripts",
  "tools",
  "scratch",
  "build",
  "dist",
  ".venv",
  "venv"
]

[tool.ruff.lint]
ignore = [
  "E402", "E701", "E702", "E722", "F841",
  "BLE001", "S110", "S112",
  "RUF059", "RUF012", "RUF015",
  "B008", "B017",
  "ASYNC230", "ASYNC220",
  "TRY004", "TRY002",
  "SIM102", "SIM103",
  "UP007", "UP011", "UP035", "UP041", "UP045",
  "I001",
  "C401",
  "DTZ005", "ISC004",
  "PIE810", "PLW1510", "PLW0602",
  "FURB167",
]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["call-arg", "var-annotated"]

